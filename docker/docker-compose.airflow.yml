# Airflow for the capstone pipeline.
#
# Bring up the base stack FIRST (Kafka + Qdrant) so this can attach to its
# network:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.airflow.yml up -d --build
#
# UI: http://localhost:8081   (admin / admin)
# The DAG "capstone_pipeline" is mounted from ../dags.

name: capstone-airflow

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  image: capstone-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/project
    # pipeline config - reach the base stack over the shared docker network
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    QDRANT_URL: http://qdrant:6333
    LAKEHOUSE_ROOT: /opt/project/lakehouse
    BRONZE_PATH: /opt/project/lakehouse/bronze/vitals
    SILVER_PATH: /opt/project/lakehouse/silver/vitals
    GOLD_PATH: /opt/project/lakehouse/gold/news2_scores
    GX_ROOT: /opt/project/gx
    CORPUS_DIR: /opt/project/corpus
    FASTEMBED_CACHE_PATH: /opt/project/models
    OPENLINEAGE_TRANSPORT: file
    OPENLINEAGE_FILE_PATH: /opt/project/lineage/events.jsonl
    OPENLINEAGE_NAMESPACE: clinical-vitals-capstone
    HF_HUB_DISABLE_SYMLINKS: "1"
    TQDM_DISABLE: "1"
  volumes:
    - ../dags:/opt/airflow/dags
    - ../src:/opt/project/src
    - ../config:/opt/project/config
    - ../corpus:/opt/project/corpus
    - ../data:/opt/project/data
    - ../lakehouse:/opt/project/lakehouse
    - ../models:/opt/project/models
    - ../gx:/opt/project/gx
    - ../lineage:/opt/project/lineage
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname a --lastname b --role Admin --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
  airflow-logs:

networks:
  default:
    name: capstone_default
    external: true
